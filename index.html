<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: min(90%, 600px);
            background: white;
            padding: 40px 30px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.12);
        }
        h1 { margin-bottom: 10px; color: #1e293b; }
        p { color: #64748b; line-height: 1.6; }
        .tech {
            margin: 25px 0;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 10px;
            color: #334155;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Management System</h1>
        <p>Welcome to a Java Full-Stack application built using MVC architecture.</p>

        <div class="tech">
            <strong>Technologies</strong><br><br>
            HTML & CSS • Java Servlet • MVC • JDBC • MySQL • Maven
        </div>

        <a class="btn" href="students">Open Student Management</a>
    </div>
</body>
</html>
